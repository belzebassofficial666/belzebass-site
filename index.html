<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BELZEBASS | Official Website</title>

<meta name="description" content="BELZEBASS - Driven By Anxiety Since 2008. Recently switched to a live dawless setup. Different approach, same energy.">

<meta property="og:title" content="BELZEBASS">
<meta property="og:description" content="Driven By Anxiety Since 2008">
<meta property="og:image" content="hero.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#000;
color:#fff;
font-family:Arial, Helvetica, sans-serif;
overflow-x:hidden;
}

.hero{
height:100vh;
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:url('hero.jpg') center center/cover no-repeat;
filter:brightness(0.35);
}

.hero-content{
position:relative;
z-index:2;
width:90%;
max-width:900px;
}

.logo{
width:550px;
max-width:90%;
margin-bottom:40px;
filter:drop-shadow(0 0 20px rgba(255,255,255,.10));
}

.bio{
font-size:1rem;
line-height:1.8;
letter-spacing:3px;
text-transform:uppercase;
max-width:700px;
margin:auto;
}

.scroll{
margin-top:40px;
font-size:2rem;
opacity:.6;
animation:float 2s infinite;
}

.visual-loop{
padding:80px 0;
display:flex;
justify-content:center;
}

.loop-container{
width:350px;
max-width:90%;
}

.loop-container video{
width:100%;
height:auto;
display:block;
}    

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(10px);}
}

section{
padding:120px 10%;
}

.section-title{
font-size:1rem;
letter-spacing:8px;
text-transform:uppercase;
margin-bottom:40px;
border-left:2px solid #fff;
padding-left:20px;
}

.video-container{
display:flex;
justify-content:center;
}

.video-wrapper{
width:100%;
max-width:1000px;
aspect-ratio:16/9;
}

.video-wrapper iframe{
width:100%;
height:100%;
border:none;
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.gallery img{
width:100%;
height:350px;
object-fit:cover;
transition:.4s;
opacity:0.5;    
cursor:pointer;
}

.gallery img:hover{
transform:scale(1.03);
opacity:1;
}

.socials{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:40px;
margin-top:40px;
}

.socials a{
border:none;
padding:0;
background:none;
}

.socials img{
width:50px;
height:50px;
object-fit:contain;
opacity:0.8;
transition:all 0.3s ease;
}

.socials img:hover{
transform:scale(1.10);
filter:drop-shadow(0 0 2px rgba(255,255,255,.2));
opacity:1;
}

.mail{
text-align:center;
margin-top:50px;
margin-bottom:50px;    
font-size:1rem;
letter-spacing:2px;
}

.mail a{
color:#fff;
text-decoration:none;
letter-spacing:4px;
opacity:.8;
transition:all .25s ease;
}

.mail a:hover{
opacity:1;
transform:scale(1.05);
}

footer{
padding:50px;
text-align:center;
font-size:.8rem;
opacity:.5;
border-top:1px solid rgba(255,255,255,.1);
}

@media(max-width:768px){

.logo{
width:400px;
max-width:90%;    
}

.gallery{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.gallery img{
height:180px;
}    

.bio{
font-size:.85rem;
letter-spacing:2px;
}

.socials{
display:flex;
justify-content:space-evenly;
align-items:center;
flex-wrap:nowrap;
width:100%;
gap:0;
}

.socials img{
width:32px;
height:32px;
}
    
section{
padding:90px 6%;
}

}

#lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:9999;
cursor:pointer;
}

#lightbox img{
max-width:90%;
max-height:90%;
object-fit:contain;
}
    
</style>

</head>

<div class="video-wrapper">

src="https://www.youtube.com/embed/-_eLpFota_M"

</iframe>

</div>

<div class="gallery">

<img src="gallery1.jpg" alt="" onclick="openImage(this.src)">
<img src="gallery4.jpg" alt="" onclick="openImage(this.src)">

<img src="gallery7.jpg" alt="" onclick="openImage(this.src)">

<div class="loop-container">

<div id="lightbox" onclick="closeImage()">
    <img id="lightbox-img">
</div>

<script>

function openImage(src){
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lightbox.style.display = "flex";

    document.body.style.overflow = "hidden";
}

function closeImage(){
    document.getElementById("lightbox").style.display = "none";
    document.body.style.overflow = "auto";
}

function closeImage(){
    document.getElementById("lightbox").style.display = "none";
}

</script>
